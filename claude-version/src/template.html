<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parlei Language Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Header across the top; nav is a left rail on wide screens and a bottom tab bar on phones. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#14202B; --muted:#5A6777; --line:#D8DEE6;
  --accent:#2445C4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --ok:#1C7448; --ok-soft:#DCF0E4; --warn:#9A5700; --warn-soft:#FBEACF; --bad:#B0222E; --bad-soft:#F8DDE0;
  --display:'Libre Caslon Display', 'Iowan Old Style', Georgia, serif;
  --body:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(20,32,43,.06), 0 6px 24px rgba(20,32,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#17202A; --sunk:#121A22; --ink:#E6EBF1; --muted:#98A5B4; --line:#283441;
    --accent:#8FA7FF; --accent-ink:#0E141B; --accent-soft:#1E2947;
    --ok:#73D2A2; --ok-soft:#14301F; --warn:#F0B65C; --warn-soft:#38290F; --bad:#FF8C95; --bad-soft:#3A1A1E;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --sunk:#121A22; --ink:#E6EBF1; --muted:#98A5B4; --line:#283441;
  --accent:#8FA7FF; --accent-ink:#0E141B; --accent-soft:#1E2947;
  --ok:#73D2A2; --ok-soft:#14301F; --warn:#F0B65C; --warn-soft:#38290F; --bad:#FF8C95; --bad-soft:#3A1A1E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25); color-scheme:dark;
}
/* Daylight: an opt-in bright palette in lighter blues; wins over the device or app theme */
:root:root.daylight{
  --bg:#EAF4FF; --surface:#FFFFFF; --sunk:#F3F9FF; --ink:#0F2740; --muted:#4A6582; --line:#C9DEF3;
  --accent:#1F74D6; --accent-ink:#FFFFFF; --accent-soft:#D9EAFD;
  --ok:#1B7A4A; --ok-soft:#DDF3E6; --warn:#9A5A00; --warn-soft:#FFF0D6; --bad:#B4262F; --bad-soft:#FCE3E5;
  --shadow:0 1px 2px rgba(31,116,214,.08), 0 6px 24px rgba(31,116,214,.08); color-scheme:light;
}
.daylight .top{background:linear-gradient(180deg,#FFFFFF,#F3F9FF)}
.daylight #nav{background:#FFFFFF}
.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.theme-btn:hover{color:var(--ink)}
.theme-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
h1{font:400 34px/1.15 var(--display);letter-spacing:0}
h2{font:400 26px/1.15 var(--display)}
h3{font-size:17px;font-weight:600}
h4{font-size:15px;font-weight:600}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto}
.mark{width:34px;height:34px;flex:none;display:block}
.brand .name{font:400 22px/1 var(--display)}
.top select{max-width:230px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunk)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}

#nav{display:flex;background:var(--surface);border-top:1px solid var(--line);position:fixed;left:0;right:0;bottom:0;z-index:20;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:11px;border-radius:10px;position:relative;min-width:0}
#nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
#nav .long{display:none}
#nav .short{white-space:nowrap}
#nav .sec{display:none}
#nav .more-btn{display:flex}
.navsheet{display:flex;flex-direction:column;gap:6px}
.navsheet a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:500;position:relative}
.navsheet .badge{position:static;margin-left:auto}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
#main{overflow:auto;padding:20px 16px 96px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

@media (min-width:860px){
  #app{grid-template-columns:220px 1fr}
  .top{grid-column:1 / -1}
  #nav{position:static;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:2px}
  #nav a{flex:none;flex-direction:row;gap:10px;font-size:14px;padding:9px 12px;justify-content:flex-start}
  #nav .short{display:none}
  #nav .sec{display:flex}
  #nav .more-btn{display:none}
  #nav .long{display:inline}
  .badge{position:static;margin-left:auto}
  #main{padding:28px 32px 48px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.narrow{max-width:460px;margin:24px auto;width:100%}
.card-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.cols{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:980px){.cols{grid-template-columns:1fr 1fr}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.hero{display:flex;gap:18px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hero h1{margin-top:4px}
.hero .muted{margin-top:6px;max-width:60ch}
.codebox{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:10px 14px}
.codebox .label{font-size:12px;color:var(--muted)}
.code{font:600 22px/1.2 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px;min-width:0}
a.tile:hover{border-color:var(--accent)}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font:400 30px/1.05 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v.sm{font:600 15px/1.3 var(--body)}
.tile.alert{border-color:var(--warn);background:var(--warn-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}
.link.danger{color:var(--bad)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
button.item{background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;width:100%;color:inherit}
button.item:first-child{border-top:0}
button.item:hover .t{color:var(--accent)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:10px;text-align:center}
.unit-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;flex:none}
.stat{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}

.ann{padding:12px 14px;border-radius:10px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.ann p{white-space:pre-wrap;overflow-wrap:anywhere}
.ann .meta{font-size:12px;color:var(--muted);display:flex;gap:10px}

.lesson{max-width:720px}
.lesson-body{display:flex;flex-direction:column;gap:12px;font-size:16px}
.lesson-body h3{font:400 26px/1.2 var(--display);margin-top:6px}
.lesson-body h4{font-size:16px;margin-top:6px}
.lesson-body ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.lesson-body p{max-width:65ch}
.phrases{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.ph{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.ph .fr{font-weight:600}
.ph .en{color:var(--muted)}
@media (max-width:520px){.ph{grid-template-columns:1fr auto}.ph .en{grid-column:1;grid-row:2}}
.say{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--accent);flex:none;vertical-align:middle}
.say .ic{width:16px;height:16px}
.say:hover{border-color:var(--accent)}

.ev-day{font-weight:600;margin-top:4px}
.ev{display:flex;gap:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);align-items:flex-start;flex-wrap:wrap}
.ev-time{min-width:78px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.ev-time b{font-size:15px}
.ev-time span{font-size:12px;color:var(--muted)}
.ev-body{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px}
.ev.slot{border-style:dashed}
.ev.mine{border-color:var(--ok);background:var(--ok-soft)}

.inbox{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:980px){.inbox{grid-template-columns:300px 1fr}}
.thread{display:flex;flex-direction:column;gap:10px;min-height:320px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--sunk);border:1px solid var(--line);align-self:flex-start}
.msg.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:14px 14px 4px 14px}
.msg p{white-space:pre-wrap;overflow-wrap:anywhere}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:vertical;min-height:42px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}

label{font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=search],input[type=email],input[type=tel],input:not([type]),select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--sunk)}
textarea{resize:vertical;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:8px}
.stack > label{margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.grid2 > div,.grid3 > div{display:flex;flex-direction:column;gap:6px}
@media (max-width:480px){form .grid2.stackable{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:center;font-weight:500;margin-top:8px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
code{font:13px ui-monospace,Menlo,monospace;background:var(--sunk);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}

#modalRoot{position:fixed;inset:0;z-index:50;display:none}
#modalRoot.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,16,24,.5)}
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.sheet.wide{width:min(820px,calc(100% - 24px))}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--muted);flex:none}

.q{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.q legend{font-weight:600;padding:0 4px}
.opt{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;font-weight:400;font-size:15px;cursor:pointer}
.opt:hover{background:var(--sunk)}
.opt.right{background:var(--ok-soft);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.answer{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-wrap:anywhere}
.feedback{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 10px 10px 0}
.grade-row{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grade-inline{display:flex;gap:8px;align-items:center}
.grade-inline input{width:90px}

.pr-top{display:flex;align-items:center;gap:12px;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.flash{min-height:220px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--sunk));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;cursor:pointer;user-select:none}
.flash.flipped{cursor:default}
.flash .face{font:400 38px/1.15 var(--display);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;overflow-wrap:anywhere}
.flash .back{font-size:19px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line);min-width:60%}
.flash .tap{font-size:13px;color:var(--muted)}
.pr-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-actions .wide{grid-column:1 / -1}
.big-num{font:400 54px/1 var(--display);font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.tab.add{border-style:dashed;color:var(--accent)}
.quick{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
@media (max-width:620px){.quick{grid-template-columns:1fr 1fr}.quick .btn{grid-column:auto}}
.lookup-note{font-size:13px;color:var(--muted);line-height:1.6}
.found{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.quick > div{display:flex;flex-direction:column;gap:5px}
details.more summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500}
details.more[open] summary{margin-bottom:8px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.searchbox{flex:1;min-width:200px;position:relative}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.searchbox input{padding-left:36px}
.toolbar select{width:auto;flex:1}
@media (min-width:621px){.toolbar select{flex:none}}
@media (max-width:620px){.searchbox{flex-basis:100%}}
.word{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.word:first-child{border-top:0}
.word .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.word .term{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.word .mean{overflow-wrap:anywhere}
.word .ex{font-style:italic;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.word .src{font-size:12px;color:var(--muted)}
.word .tools{display:flex;gap:4px;align-items:center;flex:none}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{border-color:var(--line)}
.icon-btn .ic{width:17px;height:17px}
.icon-btn[aria-pressed="true"]{color:var(--warn)}
.icon-btn[aria-pressed="true"] .ic{fill:currentColor}
.lookup-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 1px}
.au{display:flex;flex-direction:column;gap:10px}
.au-head{display:flex;gap:12px;align-items:flex-start}
.au-ic{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.au audio{width:100%;height:40px}
.speeds{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.speeds button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--muted)}
.speeds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chiplink{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.mitem{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.mitem:first-child{border-top:0}
.mitem .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mitem .t{font-weight:600;overflow-wrap:anywhere}
.mitem .t a{color:inherit;text-decoration-color:var(--line)}
.mitem .s{font-size:13px;color:var(--muted)}
.mitem .notes{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.mitem .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:none}
.mitem select{width:auto;padding:4px 8px;font-size:13px}
.mtype{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.rating{display:inline-flex;gap:1px}
.rating button{background:none;border:0;padding:1px;cursor:pointer;color:var(--line)}
.rating button.on{color:var(--warn)}
.rating .ic{width:15px;height:15px;fill:currentColor;stroke:none}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad);color:#fff}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.skeleton{height:90px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

    <div class="brand"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><defs><clipPath id="markClip"><rect width="40" height="40" rx="10"/></clipPath></defs><g clip-path="url(#markClip)"><rect width="40" height="40" fill="var(--accent)"/><g transform="translate(0.4,5.6) scale(1,0.86)"><path fill="var(--accent-ink)" d="M8 46 L8 32 C8 27 5 23.5 5 17.5 C5 10 10.5 5 17 5 C22.5 5 25.6 8.6 26.2 12.6 L28.6 16.8 C29 17.5 28.6 18 27.9 18 L26.4 18 L26.4 19.3 L25.2 19.9 L26.5 20.6 L26.2 22.6 C26 24 24.8 24.7 23.4 24.6 L20.4 24.3 L20.4 46 Z"/><g fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"><path d="M30.6 16.6 A4.5 4.5 0 0 1 30.6 23.2"/><path d="M33.6 13.4 A8.6 8.6 0 0 1 33.6 26.4"/></g></g></g></svg><span class="name">Parlei</span></div>

<script>
'use strict';
/* ---------- basics ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MIN = 6e4, DAY = 864e5;
const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32];          // Leitner boxes: days until the next review
const LANGS = {fr:'French', es:'Spanish', 'pt-BR':'Portuguese', it:'Italian', de:'German', en:'English'};
const CODE_ALPHA = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode = () => Array.from({length:6}, () => CODE_ALPHA[Math.floor(Math.random()*CODE_ALPHA.length)]).join('');
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  book:'<path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3z"/><path d="M21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/>',
  check:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>',
  cards:'<rect x="3" y="7" width="13" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',

  plus:'<path d="M12 5v14M5 12h14"/>',
  abc:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/>',
  star:'<path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  media:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  more:'<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  wave:'<path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>'
};
const icon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const VIEWS = [
  {id:'home', long:'Home', short:'Home', icon:'home'},
  {id:'lessons', long:'Lessons', short:'Lessons', icon:'book'},
  {id:'words', long:'Word Bank', short:'Word Bank', icon:'abc'},
  {id:'media', long:'Media', short:'Media', icon:'media', sec:true},
  {id:'work', long:'Assignments', short:'Work', icon:'check'},
  {id:'practice', long:'Flashcards', short:'Practice', icon:'cards', sec:true},
  {id:'calendar', long:'Schedule', short:'Schedule', icon:'cal', sec:true},
  {id:'inbox', long:'Messages', short:'Inbox', icon:'chat'},
  {id:'students', long:'Students', short:'Students', icon:'users', sec:true, teacher:true}
];
const navViews = () => VIEWS.filter(v => !v.teacher || S.role === 'teacher');

/* ---------- state ---------- */
const S = {
  db:null, user:null, tts:null, me:null, isOwner:false, teacherIds:[], teacherCapable:false, role:'student',
  demo:false, fatal:null, slow:false, readOnly:false, data:{}, loaded:{}, names:{},
  classId:null, view:'home', lessonId:null, threadId:null, showPast:false, dirty:false, practice:null, dir:'fwd',
  wordLang:null, wordQ:'', wordSort:'new', assets:null, sample:null, blobUrls:{}, mediaTab:null, mediaType:'all', mediaStatus:'all', stuQ:'', stuClass:'all'
};
const D = S.data;
const store = {
  get(k){ try { return localStorage.getItem('parlons.' + k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem('parlons.' + k, v); } catch (e) {} }
};

/* ---------- in-memory store (demo mode when opened outside claude.ai) ---------- */
function memoryDB(){
  const docs = new Map(), subs = new Set();
  const clone = o => JSON.parse(JSON.stringify(o));
  const meta = {fromCache:false, hasPendingWrites:false};
  const snap = p => { const d = docs.get(p); return {id:p.split('/').pop(), exists:!!d, data:() => d ? clone(d) : undefined, metadata:meta}; };
  const fire = () => subs.forEach(f => f());
  const merge = (a, b) => { for (const k in b) { const v = b[k]; if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v); else a[k] = v; } return a; };
  const docRef = p => ({ id:p.split('/').pop(), path:p,
    async get(){ return snap(p); },
    async set(d){ docs.set(p, clone(d)); fire(); },
    async update(d){ if (!docs.has(p)) throw {code:'invalid_argument', message:'missing'}; docs.set(p, merge(docs.get(p), clone(d))); fire(); },
    async delete(){ docs.delete(p); fire(); },
    onSnapshot(next){ const f = () => next(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    collection(c){ return colRef(p + '/' + c); }
  });
  const colRef = (p, filters = []) => {
    const run = () => { const out = []; for (const [k, d] of docs) { if (k.slice(0, k.lastIndexOf('/')) === p && filters.every(([f, , v]) => d[f] === v)) out.push(snap(k)); } out.sort((a, b) => a.id < b.id ? -1 : 1); return {docs:out, size:out.length, empty:!out.length, docChanges:() => [], metadata:meta}; };
    const q = { path:p,
      doc(id){ return docRef(p + '/' + (id || rid())); },
      async add(d){ const r = docRef(p + '/' + rid()); await r.set(d); return r; },
      where(f, op, v){ return colRef(p, filters.concat([[f, op, v]])); },
      orderBy(){ return q; }, limit(){ return q; },
      async get(){ return run(); },
      onSnapshot(next){ const f = () => next(run()); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); }
    };
    return q;
  };
  return { doc:docRef, collection:p => colRef(p) };
}
const SEED = __SEED__;
const DEMO = __DEMO__;

/* ---------- writes: one at a time per document ---------- */
const chains = {};
function errText(e){
  const c = e && e.code;
  if (c === 'invalid_argument') { S.readOnly = true; schedule(); return "You can't change this with your current access. Ask your teacher to invite you as an editor."; }
  if (c === 'quota_exceeded') return 'Storage is full. Delete some old items, then try again.';
  if (c === 'resource_exhausted') return 'Too many changes at once. Wait a moment and try again.';
  return "Couldn't save. Check your connection and try again.";
}
function queue(path, fn){
  const run = async () => { try { await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random()*600)); await fn(); } else throw e; } };
  const p = (chains[path] || Promise.resolve()).then(run);
  chains[path] = p.catch(() => {});
  return p.then(() => true, e => { toast(errText(e), true); return false; });
}
const setDoc = (path, data) => queue(path, () => S.db.doc(path).set(data));
const delDoc = path => queue(path, () => S.db.doc(path).delete());
const upsert = (path, part) => queue(path, async () => { const r = S.db.doc(path); const s = await r.get(); if (s.exists) await r.update(part); else await r.set(part); });

/* ---------- reads ---------- */
let renderQueued = false;
function schedule(){ if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function markLoaded(n){ S.loaded[n] = true; }
function listenCol(name){
  D[name] = {};
  S.db.collection(name).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    D[name] = m; if (!snap.metadata || !snap.metadata.fromCache) markLoaded(name); else if (!S.loaded[name]) S.loaded[name] = 'cache';
    schedule();
  }, () => { markLoaded(name); schedule(); });
}
function listenOwn(name){
  D[name] = {};
  S.db.doc(name + '/' + S.me).onSnapshot(s => {
    D[name] = s.exists ? {[S.me]: s.data()} : {};
    if (!s.metadata || !s.metadata.fromCache) markLoaded(name); else if (!S.loaded[name]) S.loaded[name] = 'cache';
    schedule();
  }, () => { markLoaded(name); schedule(); });
}
const ready = () => ['classes', 'members'].every(n => S.loaded[n]);
const rows = c => Object.entries(D[c] || {}).map(([id, v]) => Object.assign({id}, v));
const byCreated = (a, b) => (a.createdAt || 0) - (b.createdAt || 0);

/* names: store only ids, resolve in render */
const wantNames = new Set(); let nameTimer = null;
const profileOf = uid => (D.profiles || {})[uid] || null;
function profName(uid){ const p = profileOf(uid); return p ? String(p.preferred || [p.first, p.last].filter(Boolean).join(' ')).trim() : ''; }
function nameOf(uid){
  if (!uid) return 'Someone';
  const pn = profName(uid); if (pn) return uid === S.me ? pn + ' (you)' : pn;
  if (S.demo) return DEMO.names[uid] || 'Student';
  const n = S.names[uid];
  if (n === undefined && S.user) { wantNames.add(uid); if (!nameTimer) nameTimer = setTimeout(fetchNames, 30); }
  if (uid === S.me) return n ? n + ' (you)' : 'You';
  return n || 'Student';
}
async function fetchNames(){
  nameTimer = null; const ids = [...wantNames]; wantNames.clear();
  if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => { S.names[id] = (ps && ps[id] && ps[id].name) || ''; }); }
  catch (e) { ids.forEach(id => { S.names[id] = ''; }); }
  schedule();
}
const initials = uid => { const n = nameOf(uid).replace(/\s*\(you\)$/, ''); return (n.match(/\b\w/g) || ['?']).slice(0, 2).join('').toUpperCase(); };

/* domain helpers */
function myClasses(){
  const all = rows('classes').sort(byCreated);
  if (S.role === 'teacher') return S.isOwner ? all : all.filter(c => c.teacherId === S.me);
  const m = (D.members || {})[S.me]; const ids = m && m.classIds ? Object.keys(m.classIds).filter(k => m.classIds[k]) : [];
  return all.filter(c => ids.includes(c.id));
}
function currentClass(){
  const cs = myClasses(); if (!cs.length) return null;
  return cs.find(c => c.id === S.classId) || cs.find(c => c.id === store.get('class')) || cs[0];
}
const inClass = (col, cid) => rows(col).filter(x => x.classId === cid);
const myClassesAll = () => rows('classes').sort(byCreated);
const classOf = id => { const c = (D.classes || {})[id]; return c ? Object.assign({id}, c) : null; };
function studentsOf(cid){ return Object.entries(D.members || {}).filter(([, m]) => m.classIds && m.classIds[cid]).map(([uid, m]) => ({uid, joined:m.classIds[cid]})).sort((a, b) => a.joined - b.joined); }
const subOf = (uid, aid) => { const s = (D.subs || {})[uid]; return (s && s.items && s.items[aid]) || null; };
const progOf = uid => { const p = (D.prog || {})[uid]; return (p && p.cards) || {}; };
const visibleLessons = cid => inClass('lessons', cid).filter(l => S.role === 'teacher' || l.published !== false);
function dueDate(due){ if (!due) return null; const [y, m, d] = due.split('-').map(Number); return new Date(y, m - 1, d, 23, 59, 59); }
function dueLabel(due){
  const dd = dueDate(due); if (!dd) return 'No due date';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((new Date(dd.getFullYear(), dd.getMonth(), dd.getDate()) - today) / DAY);
  if (diff === 0) return 'Due today'; if (diff === 1) return 'Due tomorrow';
  if (diff > 1 && diff < 7) return 'Due ' + dd.toLocaleDateString(undefined, {weekday:'long'});
  if (diff < 0) return 'Was due ' + dd.toLocaleDateString(undefined, {month:'short', day:'numeric'});
  return 'Due ' + dd.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function statusOf(a, uid){
  const s = subOf(uid, a.id);
  if (s && s.gradedAt != null && s.grade != null) return {k:'graded', label:`${fmtNum(s.grade)} / ${a.points}`, cls:'ok', s};
  if (s && s.submittedAt) return {k:'submitted', label:'Submitted', cls:'acc', s};
  const dd = dueDate(a.due);
  if (dd && dd < new Date()) return {k:'late', label:'Missing', cls:'bad', s};
  return {k:'todo', label:'To do', cls:'warn', s};
}
const fmtNum = n => (Math.round(n * 10) / 10).toString();
function toGradeCount(cid){ let n = 0; const studs = studentsOf(cid); inClass('assignments', cid).forEach(a => studs.forEach(({uid}) => { const s = subOf(uid, a.id); if (s && s.submittedAt && s.gradedAt == null) n++; })); return n; }
function todoCount(cid){ return inClass('assignments', cid).filter(a => ['todo', 'late'].includes(statusOf(a, S.me).k)).length; }
function deckStats(deck, uid){
  const p = progOf(uid), now = Date.now(); let due = 0, mastered = 0, seen = 0;
  (deck.cards || []).forEach(cd => { const x = p[deck.id + '~' + cd.id]; if (!x || x.d <= now) due++; if (x) seen++; if (x && x.b >= 4) mastered++; });
  return {total:(deck.cards || []).length, due, mastered, seen};
}
const dueCardsCount = cid => inClass('decks', cid).reduce((n, d) => n + deckStats(d, S.me).due, 0);
function eventsOf(cid, past){ const now = Date.now(); return inClass('events', cid).filter(e => { const end = new Date(e.start).getTime() + (e.mins || 60) * MIN; return past ? true : end > now; }).sort((a, b) => new Date(a.start) - new Date(b.start)); }
function bookerOf(eid){ for (const [uid, b] of Object.entries(D.bookings || {})) if (b.slots && b.slots[eid]) return uid; return null; }
const msgsOf = sid => Object.entries(((D.threads || {})[sid] || {}).msgs || {}).map(([id, m]) => Object.assign({id}, m)).sort((a, b) => a.at - b.at);
function unreadFor(sid){
  const t = (D.threads || {})[sid] || {};
  if (S.role === 'teacher') return msgsOf(sid).filter(m => m.from !== S.me && m.at > (t.readT || 0)).length;
  return msgsOf(sid).filter(m => m.from !== S.me && m.at > (t.readS || 0)).length;
}
const unreadCount = cid => S.role === 'teacher' ? studentsOf(cid).reduce((n, s) => n + unreadFor(s.uid), 0) : unreadFor(S.me);
const fmtWhen = ts => { const d = new Date(ts); const same = d.toDateString() === new Date().toDateString(); return same ? d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ', ' + d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); };
const fmtTime = iso => new Date(iso).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
const fmtDay = iso => new Date(iso).toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric'});
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };

/* ---------- text formats ---------- */
function inline(s){
  let h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  h = h.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  return h;
}
function sayBtn(text, lang){ return S.tts ? `<button type="button" class="say" data-act="say" data-text="${esc(text)}" data-lang="${esc(lang || 'fr')}" aria-label="Listen to ${esc(text)}">${icon('say')}</button>` : ''; }
function renderBody(text, lang){
  let html = '', para = [], list = false, ph = false;
  const flushP = () => { if (para.length) { html += '<p>' + para.join('<br>') + '</p>'; para = []; } };
  const endL = () => { if (list) { html += '</ul>'; list = false; } };
  const endPh = () => { if (ph) { html += '</div>'; ph = false; } };
  for (const raw of String(text || '').split('\n')) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flushP(); endL(); endPh(); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushP(); endL(); endPh(); const tag = m[1].length === 1 ? 'h3' : 'h4'; html += `<${tag}>${inline(m[2])}</${tag}>`; continue; }
    if ((m = line.match(/^\s*[-•]\s+(.*)$/))) { flushP(); endPh(); if (!list) { html += '<ul>'; list = true; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = line.match(/^(.+?)\s+=\s+(.+)$/))) { flushP(); endL(); if (!ph) { html += '<div class="phrases">'; ph = true; } html += `<div class="ph"><span class="fr">${esc(m[1].trim())}</span><span class="en">${esc(m[2].trim())}</span>${sayBtn(m[1].trim(), lang) || '<span></span>'}</div>`; continue; }
    endL(); endPh(); para.push(inline(line));
  }
  flushP(); endL(); endPh();
  return html;
}
function parseQuiz(text){
  const qs = []; let cur = null; const errors = [];
  for (const raw of String(text || '').split('\n')) {
    const l = raw.trim(); let m; if (!l) continue;

/* ---- vocabulary (each person's own word bank, one doc: vocab/<id>) ---- */
const WORD_LANGS = {fr:'French', es:'Spanish', 'pt-BR':'Portuguese (Brazil)', 'pt-PT':'Portuguese (Portugal)', it:'Italian', de:'German', en:'English', ht:'Haitian Creole', ja:'Japanese', ko:'Korean', 'zh-CN':'Mandarin', ar:'Arabic', sw:'Swahili', yo:'Yoruba', tl:'Tagalog'};
const WR_DICT = {fr:'fren', es:'esen', 'pt-BR':'pten', 'pt-PT':'pten', it:'iten', de:'deen'};
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const vocabDoc = () => (D.vocab || {})[S.me] || {};
const langName = code => WORD_LANGS[code] || (((vocabDoc().langs || {})[code] || {}).name) || code;
const ttsLang = code => /^x-/.test(code) ? 'auto' : code;
function myWords(lang){ return Object.entries(vocabDoc().words || {}).filter(([, w]) => w && w.term).map(([id, w]) => Object.assign({id}, w)).filter(w => !lang || w.lang === lang); }
function myLangs(){
  const ls = Object.entries(vocabDoc().langs || {}).filter(([, x]) => x).sort((a, b) => (a[1].at || 0) - (b[1].at || 0)).map(([k]) => k);
  myWords().forEach(w => { if (!ls.includes(w.lang)) ls.push(w.lang); });
  return ls;
}
function courseVocab(lang){
  const out = [], seen = new Set(), base = l => String(l || '').split('-')[0];
  const push = (term, meaning, src) => { const k = norm(term); if (!k || seen.has(k)) return; seen.add(k); out.push({term, meaning, src}); };
  myClasses().filter(c => base(c.language) === base(lang)).forEach(c => {
    inClass('decks', c.id).forEach(d => (d.cards || []).forEach(cd => push(cd.f, cd.b, d.title)));
    visibleLessons(c.id).forEach(l => String(l.body || '').split('\n').forEach(line => { if (/^\s*[-•#]/.test(line)) return; const m = line.match(/^(.+?)\s+=\s+(.+)$/); if (m) push(m[1].trim(), m[2].trim(), l.title); }));
  });
  return out;
}
function hl(text, q){
  const t = String(text || ''); if (!q) return esc(t);
  const n = norm(t), i = n.indexOf(q); if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}
function currentWordLang(){
  const ls = myLangs(); if (!ls.length) return null;
  if (S.wordLang && ls.includes(S.wordLang)) return S.wordLang;
  const saved = store.get('wordLang'); return ls.includes(saved) ? saved : ls[0];
}
function wordRow(w, q, lang){
  return `<div class="word"><div class="grow"><span class="term">${hl(w.term, q)} ${sayBtn(w.term, ttsLang(lang))}</span><span class="mean">${hl(w.meaning, q)}</span>${w.example ? `<span class="ex">${esc(w.example)}</span>` : ''}${w.note ? `<span class="src">${esc(w.note)}</span>` : ''}</div>
    <div class="tools"><button class="icon-btn" data-act="starWord" data-id="${esc(w.id)}" aria-pressed="${!!w.star}" aria-label="${w.star ? 'Unstar' : 'Star'} ${esc(w.term)}">${icon('star')}</button><button class="btn sm" data-act="editWord" data-id="${esc(w.id)}">Edit</button></div></div>`;
}
function wordResultsHTML(){
  const lang = currentWordLang(); if (!lang) return '';
  const q = norm(S.wordQ), mine = myWords(lang);
  const match = w => !q || norm(w.term).includes(q) || norm(w.meaning).includes(q) || norm(w.example).includes(q);
  let list = mine.filter(match);
  if (S.wordSort === 'az') list.sort((a, b) => norm(a.term).localeCompare(norm(b.term)));
  else if (S.wordSort === 'star') list = list.filter(w => w.star).sort((a, b) => (b.at || 0) - (a.at || 0));
  else list.sort((a, b) => (b.at || 0) - (a.at || 0));
  const have = new Set(mine.map(w => norm(w.term)));
  const course = courseVocab(lang).filter(x => !have.has(norm(x.term)) && (!q || norm(x.term).includes(q) || norm(x.meaning).includes(q)));
  const courseRow = x => `<div class="word"><div class="grow"><span class="term">${hl(x.term, q)} ${sayBtn(x.term, ttsLang(lang))}</span><span class="mean">${hl(x.meaning, q)}</span><span class="src">From ${esc(x.src)}</span></div><div class="tools"><button class="btn sm" data-act="addCourseWord" data-term="${esc(x.term)}" data-meaning="${esc(x.meaning)}">${icon('plus')} Add</button></div></div>`;
  let h = `<section class="card"><div class="card-head"><h3>${q ? 'In your words' : 'Your words'}</h3><span class="hint">${list.length} ${list.length === 1 ? 'word' : 'words'}</span></div>`;
  h += list.length ? `<div class="list">${list.map(w => wordRow(w, q, lang)).join('')}</div>` : `<p class="empty">${q ? 'Not in your list yet.' : S.wordSort === 'star' ? 'Star words you want to focus on.' : 'Add your first word above.'}</p>`;
  h += '</section>';
  if (q) {
    h += `<section class="card"><div class="card-head"><h3>In your course</h3><span class="hint">${course.length} found</span></div>${course.length ? `<div class="list">${course.slice(0, 40).map(courseRow).join('')}</div>` : '<p class="empty">No lesson or flashcard has this word.</p>'}
      <div class="lookup-links"><span class="muted">Look it up:</span>${WR_DICT[lang] ? `<a class="btn sm" href="https://www.wordreference.com/${WR_DICT[lang]}/${encodeURIComponent(S.wordQ.trim())}" target="_blank" rel="noopener">WordReference</a>` : ''}<a class="btn sm" href="https://translate.google.com/?sl=${encodeURIComponent(/^x-/.test(lang) ? 'auto' : lang)}&tl=en&text=${encodeURIComponent(S.wordQ.trim())}" target="_blank" rel="noopener">Google Translate</a><a class="btn sm" href="https://en.wiktionary.org/wiki/${encodeURIComponent(S.wordQ.trim())}" target="_blank" rel="noopener">Wiktionary</a></div></section>`;
  } else if (course.length && S.wordSort !== 'star') {
    h += `<section class="card"><details class="more"><summary>${course.length} words from your course you haven't added</summary><div class="list">${course.slice(0, 80).map(courseRow).join('')}</div></details></section>`;
  }
  return h;
}

/* audio conversion: anything the browser can decode -> mono Opus in WebM (accepted as video/webm) */
let muxerLib = null;
function loadMuxer(){
  if (window.WebMMuxer) return Promise.resolve(window.WebMMuxer);
  if (!muxerLib) muxerLib = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/webm-muxer@5.1.4/build/webm-muxer.js'; sc.onload = () => window.WebMMuxer ? res(window.WebMMuxer) : rej({code:'nocodec'}); sc.onerror = () => { muxerLib = null; rej({code:'nolib'}); }; document.head.appendChild(sc); });
  return muxerLib;
}
async function toWebm(file, onProgress){
  if (!window.AudioEncoder || !window.AudioData || !window.OfflineAudioContext) throw {code:'nocodec'};
  const sr = 48000;
  let buf; try { buf = await new OfflineAudioContext(1, 1, sr).decodeAudioData(await file.arrayBuffer()); } catch (e) { throw {code:'decode'}; }
  const cfg = {codec:'opus', sampleRate:sr, numberOfChannels:1, bitrate:64000};
  const ok = await AudioEncoder.isConfigSupported(cfg).catch(() => ({supported:false})); if (!ok.supported) throw {code:'nocodec'};
  const {Muxer, ArrayBufferTarget} = await loadMuxer();
  const muxer = new Muxer({target:new ArrayBufferTarget(), audio:{codec:'A_OPUS', sampleRate:sr, numberOfChannels:1}});
  let failed = null;
  const enc = new AudioEncoder({output:(chunk, meta) => muxer.addAudioChunk(chunk, meta), error:e => { failed = e; }});
  enc.configure(cfg);
  const chs = Array.from({length:buf.numberOfChannels}, (_, i) => buf.getChannelData(i)), step = 4800;
  for (let off = 0; off < buf.length; off += step) {
    if (failed) throw {code:'decode'};
    const n = Math.min(step, buf.length - off), data = new Float32Array(n);
    for (const ch of chs) for (let i = 0; i < n; i++) data[i] += ch[off + i] / chs.length;
    const ad = new AudioData({format:'f32-planar', sampleRate:sr, numberOfFrames:n, numberOfChannels:1, timestamp:Math.round(off / sr * 1e6), data});
    enc.encode(ad); ad.close();
    if (enc.encodeQueueSize > 40 || off % (step * 50) === 0) { onProgress(off / buf.length); await new Promise(r => setTimeout(r, 0)); }
  }
  await enc.flush(); enc.close(); muxer.finalize(); onProgress(1);
  return {blob:new Blob([muxer.target.buffer], {type:'video/webm'}), duration:buf.duration};
}
function demoWav(){
  const sr = 8000, n = sr * 3, b = new DataView(new ArrayBuffer(44 + n * 2)); const w = (o, s) => [...s].forEach((ch, i) => b.setUint8(o + i, ch.charCodeAt(0)));
  w(0, 'RIFF'); b.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, 1, true); b.setUint32(24, sr, true); b.setUint32(28, sr * 2, true); b.setUint16(32, 2, true); b.setUint16(34, 16, true); w(36, 'data'); b.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) b.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * (330 + 110 * Math.floor(i / sr))) * 6000 * Math.min(1, (n - i) / 800), true);

function enrolment(){
  const mine = myClasses(); const ids = new Set(mine.map(c => c.id));
  const people = new Map();
  Object.entries(D.members || {}).forEach(([uid, m]) => {
    const cls = Object.entries(m.classIds || {}).filter(([cid, v]) => v && ids.has(cid)).map(([cid, v]) => ({cid, joined:v}));
    people.set(uid, {uid, classes:cls});
  });
  Object.keys(D.profiles || {}).forEach(uid => { if (!people.has(uid)) people.set(uid, {uid, classes:[]}); });
  return [...people.values()].filter(x => x.uid !== S.me || x.classes.length).map(x => {
    const p = profileOf(x.uid) || {}, joined = x.classes.length ? Math.min(...x.classes.map(c => c.joined)) : (p.createdAt || 0);
    const prog = (D.prog || {})[x.uid], sub = (D.subs || {})[x.uid];
    const subTimes = sub && sub.items ? Object.values(sub.items).map(i => i && i.submittedAt || 0) : [];
    const active = Math.max(p.lastSeen || 0, (prog && prog.updated) || 0, ...subTimes, 0);
    return Object.assign(x, {p, joined, active});
  });
}

/* ---- flashcard session ---- */
function startPractice(deckId){
  const deck = Object.assign({id:deckId}, D.decks[deckId]);
  runPractice(deckId, deck.title, deck.cards || [], (classOf(deck.classId) || {}).language || 'fr');
}
function runPractice(deckId, title, cards, lang){
  const p = progOf(S.me), now = Date.now();
  let q = cards.filter(cd => { const x = p[deckId + '~' + cd.id]; return !x || x.d <= now; });
  q = q.length ? q.slice(0, 25) : shuffle(cards).slice(0, 25);
  if (!q.length) { toast('There are no cards to practise yet.'); return; }
  const st = {deckId, q, i:0, flipped:false, pending:{}, again:new Set(), right:0, wrong:0, lang, title};
  modal('<div id="pr" class="stack" style="gap:14px"></div>', {label:'Practice ' + title});
  S.practice = st;
  S.onModalClose = () => { const n = Object.keys(st.pending).length; if (n && !S.readOnly) upsert('prog/' + S.me, {cards:st.pending, updated:Date.now()}); };
  drawPractice();
}
function drawPractice(){
  const st = S.practice, el = $('#pr'); if (!st || !el) return;
  if (st.i >= st.q.length) {
    const total = st.right + st.wrong;
    el.innerHTML = `<div class="pr-top"><span>${esc(st.title)}</span><button class="x" data-act="closeModal" aria-label="Close">×</button></div>
      <div class="flash flipped"><span class="big-num">${st.right}/${total}</span><p>${st.wrong ? `Cards you missed come back later today. À bientôt !` : 'Parfait ! Every card goes up a level.'}</p></div>
      <button class="btn primary wide" data-act="closeModal">Done</button>`;
    return;
  }
  const cd = st.q[st.i], fwd = S.dir === 'fwd';
  const front = fwd ? cd.f : cd.b, back = fwd ? cd.b : cd.f;
  el.innerHTML = `<div class="pr-top"><span>${esc(st.title)} · ${st.i + 1} of ${st.q.length}</span><button class="link" data-act="flipDir">${fwd ? 'Showing word first' : 'Showing meaning first'} · switch</button><button class="x" data-act="closeModal" aria-label="Close">×</button></div>
    <div class="flash ${st.flipped ? 'flipped' : ''}" ${st.flipped ? '' : 'data-act="reveal" role="button" tabindex="0" aria-label="Show answer"'}>
      <div class="face">${esc(front)} ${fwd ? sayBtn(cd.f, st.lang) : ''}</div>
      ${st.flipped ? `<div class="back">${esc(back)} ${fwd ? '' : sayBtn(cd.f, st.lang)}</div>` : '<div class="tap">Say it out loud, then tap to check</div>'}
    </div>
    <div class="pr-actions">${st.flipped ? '<button class="btn bad" data-act="answer" data-ok="0">Missed it</button><button class="btn ok" data-act="answer" data-ok="1">Knew it</button>' : '<button class="btn primary wide" data-act="reveal">Show answer</button>'}</div>`;
  const b = el.querySelector('.pr-actions .btn'); if (b) b.focus();
}

const ACT = {
  closeModal: () => closeModal(),
  toggleDay: () => { const on = !document.documentElement.classList.contains('daylight'); applyDaylight(on); store.set('daylight', on ? '1' : '0'); toast(on ? 'Daylight mode on' : 'Daylight mode off'); },
  cfYes: () => S.confirm && S.confirm(true),
  cfNo: () => S.confirm && S.confirm(false),
  role: d => { S.role = d.role; if (S.view === 'students' && d.role !== 'teacher') { S.view = 'home'; location.hash = 'home'; } store.set('preview', d.role === 'student' ? '1' : '0'); S.lessonId = null; S.threadId = null; render(true); },
  copyCode: async d => { try { await navigator.clipboard.writeText(d.code); toast('Join code copied'); } catch (e) { toast('Join code: ' + d.code); } },
  editClass: d => classForm(d.id),
  newCode: async d => { const ok = await upsert('classes/' + d.id, {code:newCode()}); if (ok) { toast('New join code made'); closeModal(); } },
  delClass: async d => { const c = classOf(d.id); if (await askConfirm(`Delete "${c.name}"? Students lose access to its lessons and work.`, 'Delete class')) { await delDoc('classes/' + d.id); toast('Class deleted'); } },
  newAnn: () => modal(`${head('Post an announcement', 'Everyone in the class sees this on their home page.')}<form class="stack" data-form="ann"><label for="anText">Message</label><textarea id="anText" name="text" rows="5" required maxlength="2000"></textarea><div class="actions"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary">Post</button></div></form>`, {label:'Announcement'}),
  delAnn: async d => { if (await askConfirm('Delete this announcement?')) delDoc('announcements/' + d.id); },
  student: d => studentDialog(d.uid),
  msgStudent: d => { closeModal(); S.threadId = d.uid; go('inbox'); },
  openLesson: d => { S.lessonId = d.id; render(true); $('#main').scrollTop = 0; },
  closeLesson: () => { S.lessonId = null; render(true); },
  editLesson: d => lessonForm(d.id),
  delLesson: async d => { if (await askConfirm('Delete this lesson?')) { await delDoc('lessons/' + d.id); S.lessonId = null; render(true); } },
  editA: d => assignmentForm(d.id),
  delA: async d => { if (await askConfirm("Delete this assignment? Students' answers to it will be hidden.")) delDoc('assignments/' + d.id); },

  },

    const r = readProfile(f); if (r.err) { toast(r.err, true); return; }

    const doc = {classId: old ? old.classId : c.id, title:f.title.value.trim(), kind, due:f.due.value, points:Math.max(1, Number(f.points.value) || 10), instructions:f.instructions.value, questions, createdAt: old ? old.createdAt : Date.now()};

  },
  deck: async f => {
    const id = f.dataset.id || 'd-' + rid(); const old = f.dataset.id ? D.decks[id] : null; const c = currentClass();
    const cards = parseDeck(f.cards.value, old && old.cards);
    if (!cards.length) { toast('Add at least one card, like "bonjour = hello".', true); return; }

  },
  event: async f => {
    const id = f.dataset.id; const old = id ? D.events[id] : null; const c = currentClass();
    const [y, m, d] = f.date.value.split('-').map(Number), [hh, mm] = f.time.value.split(':').map(Number);
    const start = new Date(y, m - 1, d, hh, mm); const mins = Math.max(5, Number(f.mins.value) || 60);
    const base = {classId: old ? old.classId : c.id, kind:f.kind.value, title:f.title.value.trim(), mins, link:f.link.value.trim()};
    if (id) { if (await setDoc('events/' + id, Object.assign({}, base, {start:start.toISOString(), createdAt:old.createdAt || Date.now()}))) { closeModal(); toast('Saved'); } return; }
    const n = base.kind === 'slot' ? Math.min(16, Math.max(1, Number(f.count.value) || 1)) : 1; let ok = true;
    for (let i = 0; i < n; i++) ok = (await setDoc('events/e-' + rid(), Object.assign({}, base, {start:new Date(start.getTime() + i * mins * MIN).toISOString(), createdAt:Date.now()}))) && ok;
    if (ok) { closeModal(); toast(n > 1 ? n + ' slots added' : 'Added to the schedule'); }
  },
  quiz: async f => {
    const a = Object.assign({id:f.dataset.id}, D.assignments[f.dataset.id]); const answers = (a.questions || []).map((q, i) => { const r = f.querySelector(`input[name="q${i}"]:checked`); return r ? Number(r.value) : -1; });
    if (answers.includes(-1)) { toast('Answer every question before you submit.', true); return; }
    const sc = scoreQuiz(a, answers), now = Date.now();
    if (await upsert('subs/' + S.me, {items:{[a.id]:{answers, right:sc.right, total:sc.total, grade:sc.grade, submittedAt:now, gradedAt:now, feedback:''}}})) { toast(`You scored ${sc.right} of ${sc.total}`); setTimeout(() => openAssignment(a.id), 50); }
  },
  written: async f => {
    const t = f.text.value.trim(); if (!t) { toast('Write your answer first.', true); return; }
    if (await upsert('subs/' + S.me, {items:{[f.dataset.id]:{text:t, submittedAt:Date.now()}}})) { closeModal(); toast('Handed in. Merci !'); }
  },
  grade: async f => {
    const g = f.grade.value === '' ? null : Number(f.grade.value); if (g == null || isNaN(g)) { toast('Enter a grade first.', true); return; }
    if (await upsert('subs/' + f.dataset.uid, {items:{[f.dataset.id]:{grade:g, feedback:f.feedback.value.trim(), gradedAt:Date.now()}}})) toast('Grade saved for ' + nameOf(f.dataset.uid));
  },
  audio: async f => {
    const id = f.dataset.id, c = currentClass(), btn = $('#auSave');
    const meta = {title:f.title.value.trim(), lessonId:f.lesson.value || '', notes:f.notes.value, published:f.published.checked};
    if (id) { const old = D.audio[id]; if (await setDoc('audio/' + id, Object.assign({}, old, meta))) { closeModal(); toast('Saved'); } return; }
    const file = f.file.files[0]; if (!file) { toast('Choose an audio file.', true); return; }
    if (!S.assets) { toast('Uploading needs editor access to this page.', true); return; }
    const box = $('#auStatus'), txt = $('#auStatusText'), bar = $('#auBar');
    const status = (t, p) => { box.hidden = false; txt.textContent = t; if (p != null) bar.style.width = Math.round(p * 100) + '%'; };
    btn.disabled = true;
    try {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      const direct = /mp4|m4a|aac/.test(file.type) || ['m4a', 'mp4', 'm4b'].includes(ext) ? 'video/mp4' : (/webm/.test(file.type) || ext === 'webm' ? 'video/webm' : null);
      let blob = file, type = direct, duration = null, res = null;
      if (direct && file.size <= MAX_BYTES) {
        duration = await probeDuration(file); status('Uploading…', 0.3);
        try { res = await S.assets.upload(file, {type}); } catch (e) { if (!e || e.code !== 'unsupported_type') throw e; }
      }
      if (!res) {
        status('Converting… 0%', 0);
        const out = await toWebm(file, p => status(`Converting… ${Math.round(p * 100)}%`, p * 0.8));
        if (out.blob.size > MAX_BYTES) throw {code:'too_large'};
        blob = out.blob; type = 'video/webm'; duration = out.duration; status('Uploading…', 0.85);
        res = await S.assets.upload(blob, {type});
      }
      status('Saving…', 0.95);
      const ok = await setDoc('audio/au-' + rid(), Object.assign(meta, {classId:c.id, assetId:res.id, type, size:res.sizeBytes || blob.size, duration, name:file.name, createdAt:Date.now()}));
      if (ok) { closeModal(); toast('Recording uploaded'); if (meta.lessonId && S.view !== 'lessons') S.mediaTab = 'audio'; render(true); } else btn.disabled = false;
    } catch (e) { status(audioErr(e)); bar.style.width = '0%'; btn.disabled = false; }
  },
  media: async f => {
    const id = f.dataset.id || 'm' + rid(), old = f.dataset.id ? repDoc().items[id] : null;
    const m = {lang:f.lang.value, type:f.type.value, title:f.title.value.trim(), creator:f.creator.value.trim(), url:/^https?:\/\//i.test(f.url.value.trim()) ? f.url.value.trim() : '', status:f.status.value, notes:f.notes.value.trim(), at: old ? old.at : Date.now()};
    if (!m.title) return;
    if (await upsert('media/' + S.me, {items:{[id]:m}})) { if (m.lang !== currentWordLang()) { S.wordLang = m.lang; store.set('wordLang', m.lang); } closeModal(); render(true); toast(old ? 'Saved' : `Added "${m.title}"`); }
  },
  rec: async f => {
    const c = currentClass(); const r = {classId:c.id, type:f.type.value, title:f.title.value.trim(), creator:f.creator.value.trim(), url:/^https?:\/\//i.test(f.url.value.trim()) ? f.url.value.trim() : '', note:f.note.value.trim(), at:Date.now()};

    if (await setDoc('recs/r-' + rid(), r)) { closeModal(); toast('Recommended to ' + c.name); }

    if (await upsert('vocab/' + S.me, {langs:{[code]:{at:Date.now(), name:name || WORD_LANGS[code]}}})) { S.wordLang = code; store.set('wordLang', code); if ($('#modalRoot').classList.contains('open')) closeModal(); render(true); }
  },
  word: async f => {
    const lang = currentWordLang(), term = f.term.value.trim(), meaning = f.meaning.value.trim(); if (!term || !meaning) return;
    if (myWords(lang).some(w => norm(w.term) === norm(term))) { toast(`"${term}" is already in your list.`, true); return; }
    const w = {lang, term, meaning, at:Date.now()}; if (f.example.value.trim()) w.example = f.example.value.trim(); if (f.note.value.trim()) w.note = f.note.value.trim();
    if (await upsert('vocab/' + S.me, {words:{['w' + rid()]:w}})) { S.wordQ = ''; render(true); const t = $('#wTerm'); if (t) t.focus(); toast(`Added "${term}"`); }
  },
  editWord: async f => {
    const w = {term:f.term.value.trim(), meaning:f.meaning.value.trim(), example:f.example.value.trim(), note:f.note.value.trim(), lang:f.lang.value};
    if (!w.term || !w.meaning) return;
    if (await upsert('vocab/' + S.me, {words:{[f.dataset.id]:w}})) { closeModal(); toast('Saved'); }
  },
  msg: async f => {
    const t = f.text.value.trim(); if (!t) return; const sid = f.dataset.sid, now = Date.now();

function go(v){ if (location.hash !== '#' + v) location.hash = v; else route(); }
function route(){
  const v = location.hash.slice(1); S.view = navViews().some(x => x.id === v) ? v : 'home';
  if (S.view !== 'lessons') S.lessonId = null;
  if (S.view !== 'inbox') S.threadId = null;
  render(true); $('#main').scrollTop = 0; markRead();
}
window.addEventListener('hashchange', route);

function applyDaylight(on){
  document.documentElement.classList.toggle('daylight', on);
  const b = $('#themeBtn'); if (b) { b.setAttribute('aria-pressed', String(on)); b.innerHTML = icon('sun'); }
}
applyDaylight(store.get('daylight') === '1');

/* ---------- boot ---------- */
async function boot(){
  S.view = VIEWS.some(x => x.id === location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  for (let i = 0; i < 15 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
  const C = window.claude && typeof window.claude.use === 'function' ? window.claude : null;
  let db = null, user = null, tts = null;
  if (C) [db, user, tts, S.assets, S.sample] = await Promise.all(['db', 'user', 'tts', 'assets', 'sample'].map(n => Promise.resolve().then(() => C.use(n)).catch(() => null)));
  if (C && db) {
    S.db = db; S.user = user; S.tts = tts;
    S.me = user ? await Promise.resolve(user.id()).catch(() => null) : null;
    if (!S.me) { S.fatal = 'signin'; render(true); return; }
    S.isOwner = user ? !!(await Promise.resolve(user.isOwner()).catch(() => false)) : false;
    try { const cfg = await db.doc('config/teachers').get(); S.teacherIds = cfg.exists ? ((cfg.data() || {}).ids || []) : []; } catch (e) { S.teacherIds = []; }
  } else if (C) { S.fatal = 'signin'; render(true); return; }
  else {
    S.demo = true; S.db = memoryDB(); S.me = 'demo-teacher'; S.isOwner = true;
    for (const [p, v] of Object.entries(SEED)) await S.db.doc(p).set(v);
    for (const [p, v] of Object.entries(DEMO.docs)) await S.db.doc(p).set(v);
    S.assets = { async upload(blob){ const id = rid(); S.blobUrls[id] = URL.createObjectURL(blob); return {id, url:S.blobUrls[id], sizeBytes:blob.size, contentType:blob.type}; }, async delete(id){ return {deleted:!!S.blobUrls[id]}; } };
    S.blobUrls['demo-tone'] = URL.createObjectURL(demoWav());
    await S.db.doc('audio/au-demo').set({classId:'fr-a1', title:'Les salutations, read slowly', lessonId:'l-greet', notes:'bonjour = hello\nbonsoir = good evening\nau revoir = goodbye', published:true, assetId:'demo-tone', type:'audio/wav', duration:3, createdAt:Date.now()});
  }
  S.teacherCapable = S.isOwner || S.teacherIds.includes(S.me);
  S.role = S.teacherCapable && store.get('preview') !== '1' ? 'teacher' : 'student';
  ['classes', 'lessons', 'assignments', 'decks', 'events', 'announcements', 'members', 'bookings'].forEach(listenCol);
  ['subs', 'prog', 'threads', 'profiles'].forEach(S.teacherCapable ? listenCol : listenOwn);
  listenOwn('vocab'); listenOwn('media'); listenCol('audio'); listenCol('recs');
  const t = setInterval(() => {
    if (!ready() || !S.loaded.profiles) return;
    clearInterval(t); clearTimeout(slow); S.slow = false;
    const p = profileOf(S.me);   // record last visit at most once an hour, for the teacher's Students page
    if (p && !S.demo && Date.now() - (p.lastSeen || 0) > 60 * MIN) upsert('profiles/' + S.me, {lastSeen:Date.now()});
  }, 300);
  const slow = setTimeout(() => { if (!ready()) { S.slow = true; schedule(); } }, 10000);
  render(true);
}
boot();
</script>
</body>
</html>
